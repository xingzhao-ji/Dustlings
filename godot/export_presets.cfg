; Local development exports only. No store upload, signing account or notarization.
; Paths are relative to godot/. tools/build-3d.mjs resolves them in its frozen snapshot.
[preset.0]
name="macOS Development"
platform="macOS"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.gd,*.gdshader"
exclude_filter="tests/*"
export_path="../builds/3d/Dustlings.zip"
script_export_mode=0

[preset.0.options]
custom_template/debug="../.tools/templates/macos.zip"
custom_template/release="../.tools/templates/macos.zip"
binary_format/architecture="universal"
application/bundle_identifier="com.dustlings.courtyard3d.prototype"
application/short_version="0.4.0"
application/version="0.4.0"
application/copyright="Dustlings development prototype"
display/high_res=true
codesign/codesign=1
codesign/entitlements/disable_library_validation=true
notarization/notarization=0

[preset.1]
name="Windows Development"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.gd,*.gdshader"
exclude_filter="tests/*"
export_path="../builds/3d/Dustlings.exe"
script_export_mode=0

[preset.1.options]
custom_template/debug=""
custom_template/release="../.tools/templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/modify_resources=true
application/file_version="0.4.0.0"
application/product_version="0.4.0.0"
application/product_name="Dustlings 3D"
application/file_description="Dustlings courtyard development prototype"
application/copyright="Dustlings development prototype"
debug/export_console_wrapper=0
